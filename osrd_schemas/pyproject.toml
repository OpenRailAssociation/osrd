[project]
name = "osrd_schemas"
version = "0.6.0"
description = "Auto-generated OSRD pydantic schemas (editoast + railway manager interface openapi)"
authors = [{ name = "OSRD Contributors", email = "contact@osrd.fr" }]
requires-python = ">= 3.11"

dependencies = [
  "datamodel-code-generator==0.87.0",
  "geojson-pydantic ~= 2.1.1",
  "openapi-pydantic==0.5.1",
  "pydantic >= 2.12.2",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pyright~=1.1.410", "ruff~=0.16.1"]

[build-system]
requires = ["poetry-core>=2.4.1"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["osrd_schemas"]
exclude = ["**/__pycache__"]


[tool.ruff]
exclude = ["models.py"]
