[project]
name = "osrd_schemas"
version = "0.11.2"
description = ""
authors = [{ name = "OSRD Contributors", email = "contact@osrd.fr" }]
requires-python = ">= 3.11"

dependencies = ["geojson-pydantic ~= 1.0.0", "pydantic >= 2.12.2"]

[project.optional-dependencies]
check = ["pyright ~= 1.1.393", "ruff ~= 0.15.16"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["osrd_schemas"]
exclude = ["**/__pycache__"]
