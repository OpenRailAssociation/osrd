    JourneySearchQuery:
      type: object
      required:
      - infra_id
      - timetable_ids
      - start_ms
      - start_tolerance
      - origin
      - destination
      - transfer_ms
      properties:
        destination:
          $ref: '#/components/schemas/OperationalPointPartReference'
        infra_id:
          type: integer
          format: int64
        origin:
          $ref: '#/components/schemas/OperationalPointPartReference'
        start_ms:
          type: integer
          format: int32
          description: |-
            Amount of milliseconds from 1970-01-01 00:00:00 UTC to the center of the start window.

            The start window is defined as the time between
            `start_sec - start_tolerance` and `start_sec + start_tolerance`.
          minimum: 0
        start_tolerance:
          type: integer
          format: int32
          description: |-
            Half the time of the start window in milliseconds.

            The start window is defined as the time between
            `start_sec - start_tolerance` and `start_sec + start_tolerance`.
          minimum: 0
        timetable_ids:
          type: array
          items:
            type: integer
            format: int64
          description: Until daily patterns are supported, timetables must be calendar anchored on 1970-01-01 UTC.
          uniqueItems: true
        transfer_ms:
          type: integer
          format: int32
          description: |-
            Constant time for a transfer/footpath in the same stop in milliseconds.

            The algorithm assumes that changing from one train to another in a stop
            always take this constant time.
          minimum: 0
