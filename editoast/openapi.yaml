      - HIGH_SPEED_TRAIN
      - INTERCITY_TRAIN
      - REGIONAL_TRAIN
      - NIGHT_TRAIN
      - COMMUTER_TRAIN
      - FREIGHT_TRAIN
      - FAST_FREIGHT_TRAIN
      - TRAM_TRAIN
      - TOURISTIC_TRAIN
      - WORK_TRAIN
