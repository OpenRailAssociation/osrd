          $ref: '#/components/schemas/CoreOffsetRange'
    CoreIncompatibleOffsetRangeWithValue:
      type: object
      required:
      - range
      - value
      properties:
        range:
          $ref: '#/components/schemas/CoreOffsetRange'
        value:
          type: string
    CoreObjectRange:
      type: object
      description: A range on a linear object (usually block or route)
      required:
      - id
      - begin
      - end
      properties:
        begin:
          type: integer
          format: int64
          description: The beginning of the range in mm.
          minimum: 0
        end:
          type: integer
          format: int64
          description: The end of the range in mm.
          minimum: 0
        id:
          oneOf:
          - type: string
            maxLength: 255
            minLength: 1
          description: The object identifier.
    CoreOffsetRange:
      type: object
      required:
      - start
      - end
      properties:
        end:
          type: integer
          format: int64
          minimum: 0
        start:
          type: integer
          format: int64
          minimum: 0
    CoreOperationalPointOnPath:
      type: object
      description: Operational point along a path.
      required:
      - id
      - part
      - position
      - weight
      - name
      - country_code
      - main_code
      - is_passenger_station
      properties:
        country_code:
          type: string
          minLength: 1
        id:
          oneOf:
          - type: string
            maxLength: 255
            minLength: 1
          description: Id of the operational point
        is_passenger_station:
          type: boolean
        main_code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        part:
          $ref: '#/components/schemas/OperationalPointPart'
          description: The part along the path
        plc:
          oneOf:
          - type: 'null'
          - type: string
            minLength: 1
          description: 'Primary Location Code : https://rne.eu/it/products/ccs/crd/'
        position:
          type: integer
          format: int64
          description: Distance from the beginning of the path in mm
          minimum: 0
        secondary_code:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NonBlankString'
        secondary_name:
          oneOf:
          - type: 'null'
          - type: string
            minLength: 1
        uic:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        weight:
          type:
          - integer
          - 'null'
          format: int32
          description: Importance of the operational point
          maximum: 100
          minimum: 0
    CorePathfindingInputError:
      oneOf:
      - type: object
        title: PathfindingInputErrorInvalidPathItems
        required:
        - items
