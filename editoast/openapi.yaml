    EffortCurve:
      type: object
      required:
      - speeds
      - max_efforts
      properties:
        max_efforts:
          type: array
          items:
            type: number
            format: double
          description: Max efforts in N. Must contains the same number of elements as `speeds`.
          example:
          - 23500.0
          - 23200.0
          - 21200.0
          minItems: 2
        speeds:
          type: array
          items:
            type: number
            format: double
          description: Speeds in m/s. Must contains the same number of elements as `max_efforts`
          example:
          - 0.0
          - 2.958
          - 46.719
          minItems: 2
      additionalProperties: false
    EffortCurveConditions:
      type: object
      required:
      - comfort
      - electrical_profile_level
      - power_restriction_code
      properties:
        comfort:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Comfort'
        electrical_profile_level:
          type:
          - string
          - 'null'
        power_restriction_code:
          type:
          - string
          - 'null'
      additionalProperties: false
    EffortCurves:
      type: object
      required:
      - modes
      - default_mode
      properties:
        default_mode:
          type: string
        modes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModeEffortCurves'
          propertyNames:
            type: string
      additionalProperties: false
    ElectricalProfile:
      type: object
      required:
      - value
      - power_class
      - track_ranges
      properties:
        power_class:
          type: string
          example: '1'
        track_ranges:
          type: array
          items:
            $ref: '#/components/schemas/TrackRange'
        value:
          type: string
          example: A
    ElectricalProfileSet:
      type: object
      required:
      - id
      - name
      - data
      properties:
        data:
          $ref: '#/components/schemas/ElectricalProfileSetData'
        id:
          type: integer
          format: int64
        name:
          type: string
    ElectricalProfileSetData:
      type: object
      required:
      - levels
      - level_order
      properties:
        level_order:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LevelValues'
          propertyNames:
            type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/ElectricalProfile'
    Electrification:
      type: object
      required:
      - id
      - voltage
      - track_ranges
      properties:
        id:
          type: string
          maxLength: 255
          minLength: 1
        track_ranges:
          type: array
          items:
            $ref: '#/components/schemas/ApplicableDirectionsTrackRange'
        voltage:
          type: string
          minLength: 1
      additionalProperties: false
    Endpoint:
      type: string
      enum:
      - BEGIN
      - END
    EnergySource:
      oneOf:
      - type: object
        description: energy source for a rolling stock representing a electrification
        required:
        - max_input_power
        - max_output_power
        - efficiency
        - energy_source_type
        properties:
          efficiency:
            type: number
            format: double
            maximum: 1
            minimum: 0
          energy_source_type:
            type: string
            enum:
            - Electrification
          max_input_power:
            $ref: '#/components/schemas/SpeedDependantPower'
          max_output_power:
            $ref: '#/components/schemas/SpeedDependantPower'
      - type: object
        required:
        - max_input_power
        - max_output_power
        - energy_storage
        - efficiency
        - energy_source_type
        properties:
          efficiency:
            type: number
            format: double
            maximum: 1
            minimum: 0
          energy_source_type:
            type: string
            enum:
            - PowerPack
          energy_storage:
            $ref: '#/components/schemas/EnergyStorage'
          max_input_power:
            $ref: '#/components/schemas/SpeedDependantPower'
          max_output_power:
            $ref: '#/components/schemas/SpeedDependantPower'
      - type: object
        description: energy source for a rolling stock representing a battery
        required:
        - max_input_power
        - max_output_power
        - energy_storage
        - efficiency
        - energy_source_type
        properties:
          efficiency:
            type: number
            format: double
            maximum: 1
            minimum: 0
          energy_source_type:
            type: string
            enum:
            - Battery
          energy_storage:
            $ref: '#/components/schemas/EnergyStorage'
          max_input_power:
            $ref: '#/components/schemas/SpeedDependantPower'
          max_output_power:
            $ref: '#/components/schemas/SpeedDependantPower'
      description: energy source of a rolling stock
    EnergyStorage:
      type: object
      description: energy storage of an energy source (of a rolling stock, can be a electrical battery or a hydrogen/fuel powerPack)
      required:
      - capacity
      - soc
      - soc_min
      - soc_max
      - refill_law
      properties:
        capacity:
          type: number
          format: double
        refill_law:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RefillLaw'
        soc:
          type: number
          format: double
          maximum: 1
          minimum: 0
        soc_max:
          type: number
          format: double
          maximum: 1
          minimum: 0
        soc_min:
          type: number
          format: double
          maximum: 1
          minimum: 0
      additionalProperties: false
    EtcsBrakeParams:
      type: object
      description: |-
        Braking parameters for ERTMS ETCS Level 2
        Commented with their names in ETCS specification document `SUBSET-026-3 v400.pdf` from the
        file at <https://www.era.europa.eu/system/files/2023-09/index004_-_SUBSET-026_v400.zip>
      required:
      - gamma_emergency
      - gamma_service
      - gamma_normal_service
      - k_dry
      - k_wet
      - k_n_pos
      - k_n_neg
      - t_traction_cut_off
      - t_bs1
      - t_bs2
      - t_be
      properties:
        gamma_emergency:
          $ref: '#/components/schemas/SpeedIntervalValueCurve'
          description: 'A_brake_emergency: the emergency deceleration curve (values > 0 m/s²)'
        gamma_normal_service:
          $ref: '#/components/schemas/SpeedIntervalValueCurve'
          description: 'A_brake_normal_service: the normal service deceleration curve used to compute guidance curve (values > 0 m/s²)'
        gamma_service:
          $ref: '#/components/schemas/SpeedIntervalValueCurve'
          description: 'A_brake_service: the full service deceleration curve (values > 0 m/s²)'
        k_dry:
          $ref: '#/components/schemas/SpeedIntervalValueCurve'
          description: |-
            Kdry_rst: the rolling stock deceleration correction factors for dry rails
            Boundaries should be the same as gammaEmergency
            Values (no unit) should be contained in [0, 1]
        k_n_neg:
          $ref: '#/components/schemas/SpeedIntervalValueCurve'
          description: |-
            Kn-: the correction acceleration factor on normal service deceleration in negative gradients
            Values (in m/s²) should be contained in [0, 10]
        k_n_pos:
          $ref: '#/components/schemas/SpeedIntervalValueCurve'
          description: |-
            Kn+: the correction acceleration factor on normal service deceleration in positive gradients
            Values (in m/s²) should be contained in [0, 10]
        k_wet:
          $ref: '#/components/schemas/SpeedIntervalValueCurve'
          description: |-
            Kwet_rst: the rolling stock deceleration correction factors for wet rails
            Boundaries should be the same as gammaEmergency
            Values (no unit) should be contained in [0, 1]
        t_be:
          type: number
          format: double
          description: 'T_be: safe brake build up time in s'
        t_bs1:
          type: number
          format: double
          description: 'T_bs1: time service break in s used for SBI1 computation'
        t_bs2:
          type: number
          format: double
          description: 'T_bs2: time service break in s used for SBI2 computation'
        t_traction_cut_off:
          type: number
          format: double
          description: 'T_traction_cut_off: time delay in s from the traction cut-off command to the moment the acceleration due to traction is zero'
      additionalProperties: false
