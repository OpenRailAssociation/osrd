      responses:
        '200':
          description: The linkings for a given timetable and given train schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - source
                  - target
                  properties:
                    id:
                      type: integer
                      format: int64
                    source:
                      $ref: '#/components/schemas/LinkingOccurrenceId'
                    target:
                      $ref: '#/components/schemas/LinkingOccurrenceId'
        '404':
          description: Timetable doesn't exist.
  /train_schedules/linkings/delete:
    post:
      tags:
      - linkings
      summary: Delete linkings in batch
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
        required: true
      responses:
        '204':
          description: Linkings deleted
  /train_schedules/move:
    patch:
      tags:
      - train_schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - train_schedule_ids
              - train_schedule_set_id
              properties:
                train_schedule_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                train_schedule_set_id:
                  type: integer
                  format: int64
        required: true
      responses:
        '204':
          description: The train schedule set is updated with the train schedules
  /train_schedules/occupancy_blocks:
    post:
      tags:
      - train_schedule
      summary: |-
        ## Important:
        The following train schedules are **excluded** from the result:
        - train schedules for which pathfinding fails
        - train schedules for which the simulation fails
        - train schedules for which the simulation does not respect schedule times
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupancyBlockForm'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/OccupancyBlocksTrainScheduleResult'
                propertyNames:
                  type: integer
                  format: int64
  /train_schedules/project_path:
    post:
      tags:
      - train_schedule
      summary: Projects the space-time curves and paths of a number of train schedules onto a given path.
      description: |-
        - Returns 404 if the infra or any of the train schedules are not found
        - Returns 200 with a hashmap of train_id to ProjectPathTrainResult

        ## Important:
        - The main train projected is the model train schedule without exceptions.
        - If there are exceptions defined for the train schedule that have a different projection than the main train,
          they are included in the `exceptions` field of the result.
        - The following train schedules are **excluded** from the result:
            - train schedules for which pathfinding fails
            - train schedules for which the simulation fails
        - Trains that have a simulation but that does not honor their schedule, use their schedule with straight lines
          between the known points.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPathForm'
        required: true
      responses:
        '200':
          description: Project Path Output
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ProjectPathTrainScheduleResult'
                propertyNames:
                  type: integer
                  format: int64
  /train_schedules/project_path_op:
    post:
      tags:
      - train_schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - infra_id
              - timetable_id
              - train_ids
              - operational_points_refs
              - operational_points_distances
              - use_simulation
              properties:
                electrical_profile_set_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                infra_id:
                  type: integer
                  format: int64
                operational_points_distances:
                  type: array
                  items:
                    type: integer
                    format: int64
                    minimum: 0
                  description: Distances between operational points in mm
                operational_points_refs:
                  type: array
                  items:
                    oneOf:
                    - type: object
                      title: OperationalPointReferenceId
                      required:
                      - operational_point
                      - type
                      properties:
                        operational_point:
                          oneOf:
                          - type: string
                            maxLength: 255
                            minLength: 1
                          description: The object id of an operational point
                        type:
                          type: string
                          enum:
                          - id
                    - type: object
                      title: OperationalPointReferenceDomestic
                      required:
                      - country_code
                      - main_code
                      - type
                      properties:
                        country_code:
                          type: string
                          minLength: 1
                        main_code:
                          oneOf:
                          - type: string
                            minLength: 1
                          description: The operational point main code
                        secondary_code:
                          oneOf:
                          - type: 'null'
                          - type: string
                            minLength: 1
                          description: An optional secondary code to identify a more specific location
                        type:
                          type: string
                          enum:
                          - domestic
                    - type: object
                      title: OperationalPointReferenceUic
                      required:
                      - uic
                      - type
                      properties:
                        secondary_code:
                          oneOf:
                          - type: 'null'
                          - type: string
                            minLength: 1
                          description: An optional secondary code to identify a more specific location
                        type:
                          type: string
                          enum:
                          - uic
                        uic:
                          type: integer
                          format: int32
                          description: The [UIC](https://en.wikipedia.org/wiki/List_of_UIC_country_codes) code of an operational point
                          minimum: 0
                timetable_id:
                  type: integer
                  format: int64
                train_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  uniqueItems: true
                use_simulation:
                  type: boolean
        required: true
      responses:
        '200':
          description: Project train schedules on a list of operational points.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ProjectPathTrainScheduleResult'
                propertyNames:
                  type: integer
                  format: int64
  /train_schedules/simulation_summary:
    post:
      tags:
      - train_schedule
      summary: |-
        Associate each train schedule id with its simulation summaries response
        If the simulation fails, it associates the reason: pathfinding failed or running time failed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - infra_id
              - timetable_id
              - ids
              properties:
                electrical_profile_set_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  uniqueItems: true
                infra_id:
                  type: integer
                  format: int64
                timetable_id:
                  type: integer
                  format: int64
        required: true
      responses:
        '200':
          description: Associate each train schedule id with its simulation summaries
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/TrainScheduleSimulationSummaryResult'
                propertyNames:
                  type: integer
                  format: int64
  /train_schedules/track_occupancy:
    post:
      tags:
      - train_schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - train_schedule_ids
              - operational_point_reference
              - infra_id
              - timetable_id
              - use_simulation
              properties:
                electrical_profile_set_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                infra_id:
                  type: integer
                  format: int64
                operational_point_reference:
                  $ref: '#/components/schemas/OperationalPointReference'
                timetable_id:
                  type: integer
                  format: int64
                train_schedule_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                use_simulation:
                  type: boolean
        required: true
      responses:
        '200':
          description: Track section occupancy periods for train schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - trains
                  properties:
                    local_track_name:
                      oneOf:
                      - type: 'null'
                      - type: string
                        minLength: 1
                      description: Local track name. Unset if trains occupy the operational point but the specific track is unknown.
                    trains:
                      type: array
                      items:
                        allOf:
                        - oneOf:
                          - type: object
                            title: OccurrenceIdBase
                            required:
                            - train_schedule_id
                            - index
                            - type
                            properties:
                              index:
                                type: integer
                                minimum: 0
                              train_schedule_id:
                                type: integer
                                format: int64
                              type:
                                type: string
                                enum:
                                - base
                          - type: object
                            title: OccurrenceIdModified
                            required:
                            - train_schedule_id
                            - index
                            - exception_id
                            - type
                            properties:
                              exception_id:
                                type: integer
                                format: int64
                              index:
                                type: integer
                                minimum: 0
                              train_schedule_id:
                                type: integer
                                format: int64
                              type:
                                type: string
                                enum:
                                - modified
                          - type: object
                            title: OccurrenceIdCreated
                            required:
                            - train_schedule_id
                            - exception_id
                            - type
                            properties:
                              exception_id:
                                type: integer
                                format: int64
                              train_schedule_id:
                                type: integer
                                format: int64
                              type:
                                type: string
                                enum:
                                - created
                          description: This ID is used to identify paced train occurrences and exceptions when sending them to the core API for conflict detection.
                        - type: object
                          required:
                          - time_begin
                          - duration
                          properties:
                            duration:
                              type: string
                              example: PT5M
                            time_begin:
                              type: integer
                              format: int64
                        - type: object
                          required:
                          - path_item_relative_location
                          properties:
                            path_item_relative_location:
                              oneOf:
                              - type: object
                                title: PathItemRelativeLocationExactPathItem
                                required:
                                - path_item_id
                                - type
                                properties:
                                  path_item_id:
                                    $ref: '#/components/schemas/NonBlankString'
                                    description: Path item ID, when the operational point matches an item in the input path
                                  type:
                                    type: string
                                    enum:
                                    - exact_path_item
                              - type: object
                                title: PathItemRelativeLocationBetweenPathItems
                                required:
                                - previous_path_item_id
                                - following_path_item_id
                                - type
                                properties:
                                  following_path_item_id:
                                    $ref: '#/components/schemas/NonBlankString'
                                    description: Following path item ID, when the operational point is not one of the input path items
                                  previous_path_item_id:
                                    $ref: '#/components/schemas/NonBlankString'
                                    description: Previous path item ID, when the operational point is not one of the input path items
                                  type:
                                    type: string
                                    enum:
                                    - between_path_items
                              description: |-
                                Position of an operational point on a path, relative to the input path items.
                                If the OP matches an input path item, it is located using this path item's ID,
                                else, if the path just passes by the OP, it is located using its previous and following path items IDs
