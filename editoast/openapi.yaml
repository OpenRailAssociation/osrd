        incompatible_gauge_ranges:
          type: array
          items:
            $ref: '#/components/schemas/CoreIncompatibleOffsetRange'
        incompatible_signaling_system_ranges:
          type: array
          items:
            $ref: '#/components/schemas/CoreIncompatibleOffsetRangeWithValue'
    CoreIncompatibleOffsetRange:
      type: object
      required:
      - range
      properties:
