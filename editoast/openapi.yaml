  /timetable/{id}/stdcm:
    post:
      tags:
      - stdcm
      summary: |-
        This function computes a STDCM and returns the result.
        It first checks user authorization, then retrieves timetable, infrastructure,
        train schedules, and rolling stock data, and runs train simulations.
        The result contains the simulation output based on the train schedules
        and infrastructure provided.
      description: |-
        If the simulation fails, the function uses a virtual train to detect conflicts
        with existing train schedules. It then returns both the conflict information
        and the pathfinding result from the virtual train's simulation.
      parameters:
      - name: id
        in: path
        description: timetable_id
        required: true
        schema:
          type: integer
          format: int64
      - name: infra
        in: query
        description: The infra id
        required: true
        schema:
          type: integer
          format: int64
      - name: return_debug_payloads
        in: query
        description: If true, extra payloads are returned to help with debugging
        required: false
        schema:
          type:
          - boolean
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: An STDCM request
              required:
              - steps
              - rolling_stock_id
              - comfort
              - consist_schedule
              properties:
                allowed_track_sections:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  description: |-
                    Set of authorized track section ids for the current loading gauge,
                    None value means no zone restriction.
                  uniqueItems: true
                comfort:
                  $ref: '#/components/schemas/Comfort'
                consist_schedule:
                  $ref: '#/components/schemas/ConsistSchedule'
                electrical_profile_set_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                loading_gauge_type:
                  oneOf:
                  - type: 'null'
                  - $ref: '#/components/schemas/LoadingGaugeType'
                margin:
                  type:
                  - string
                  - 'null'
                  description: Can be a percentage `X%`, a time in minutes per 100 kilometer `Xmin/100km`
                  example:
                  - 5%
                  - 2min/100km
                max_speed:
                  type:
                  - number
                  - 'null'
                  format: double
                  description: |2-
                     Maximum speed of the consist in km/h
                    Velocity in m·s⁻¹
                maximum_departure_delay:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  description: |-
                    By how long we can shift the departure time in milliseconds
                    Deprecated, first step data should be used instead
                  minimum: 0
                maximum_run_time:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  description: |-
                    Specifies how long the total run time can be in milliseconds
                    Deprecated, first step data should be used instead
                  minimum: 0
                rolling_stock_id:
                  type: integer
                  format: int64
                speed_limit_tags:
                  type:
                  - string
                  - 'null'
                  description: Train categories for speed limits
                start_time:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Deprecated, first step arrival time should be used instead
                steps:
                  type: array
                  items:
                    $ref: '#/components/schemas/PathfindingItem'
                temporary_speed_limit_group_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                time_gap_after:
                  type: integer
                  format: int64
                  description: |-
                    Margin after the train passage in milliseconds

                    Enforces that the path used by the train should be free and
                    available at least that many milliseconds after its passage.
                  minimum: 0
                time_gap_before:
                  type: integer
                  format: int64
                  description: |-
                    Margin before the train passage in seconds

                    Enforces that the path used by the train should be free and
                    available at least that many milliseconds before its passage.
                  minimum: 0
                total_length:
                  type:
                  - number
                  - 'null'
                  format: double
                  description: |2-
                     Total length of the consist in meters
                    Length in m
                total_mass:
                  type:
                  - number
                  - 'null'
                  format: double
                  description: |2-
                     Total mass of the consist
                    Mass in kg
                towed_rolling_stock_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                work_schedule_group_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
        required: true
      responses:
        '200':
          description: The simulation result
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - data
                  - event
                  properties:
                    data:
                      $ref: '#/components/schemas/StdcmProgressionEvent'
                    event:
                      type: string
                      enum:
                      - ongoing
                - type: object
                  required:
                  - data
                  - event
                  properties:
                    data:
                      $ref: '#/components/schemas/StdcmResponse'
                    event:
                      type: string
                      enum:
                      - completed
