        time_end:
          type: integer
          format: int64
          description: The aspects stop being displayed at this time (number of ms since `departure_time`)
          minimum: 0
        time_start:
          type: integer
          format: int64
          description: The aspects start being displayed at this time (number of ms since `departure_time`)
          minimum: 0
