      - op_id
      - time_ms
      properties:
        op_id:
          type: string
          description: Id of the operational point of the corresponding step in the train schedule's path.
        path_step_index:
          type: integer
          description: Index of the path step in the train schedule's path
          minimum: 0
        time_ms:
          type: integer
          format: int32
          description: Scheduled time of the step in milliseconds from 1970-01-01 00:00:00 UTC.
          minimum: 0
