                  required:
                  - trains
                  properties:
                    local_track_name:
                      oneOf:
                      - type: 'null'
                      - type: string
                        minLength: 1
                      description: Local track name. Unset if trains occupy the operational point but the specific track is unknown.
                    trains:
                      type: array
                      items:
                        allOf:
                        - oneOf:
                          - type: object
                            required:
                            - train_schedule_id
                            - index
                            - type
                            properties:
                              index:
                                type: integer
                                minimum: 0
                              train_schedule_id:
                                type: integer
                                format: int64
                              type:
                                type: string
                                enum:
                                - base
                          - type: object
                            required:
                            - train_schedule_id
                            - index
                            - exception_id
                            - exception_key
                            - type
                            properties:
                              exception_id:
                                type: integer
                                format: int64
                              exception_key:
                                type: string
                              index:
                                type: integer
                                minimum: 0
                              train_schedule_id:
                                type: integer
                                format: int64
                              type:
                                type: string
                                enum:
                                - modified
                          - type: object
                            required:
                            - train_schedule_id
                            - exception_id
                            - exception_key
                            - type
                            properties:
                              exception_id:
                                type: integer
                                format: int64
                              exception_key:
                                type: string
                              train_schedule_id:
                                type: integer
                                format: int64
                              type:
                                type: string
                                enum:
                                - created
                          description: This ID is used to identify paced train occurrences and exceptions when sending them to the core API for conflict detection.
                        - type: object
                          required:
                          - time_begin
                          - duration
                          properties:
                            duration:
                              type: string
                              example: PT5M
                            time_begin:
                              type: string
                              format: date-time
  /train_schedules/{id}:
    get:
      tags:
      - timetable
      - train_schedule
      summary: Get a train schedule by its ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The requested train schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainScheduleResponse'
    put:
      tags:
      - timetable
      - train_schedule
      summary: Update a paced train
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainSchedule'
        required: true
      responses:
        '204':
          description: The paced train has been updated
  /train_schedules/{id}/etcs_braking_curves:
    get:
      tags:
      - train_schedule
      - etcs_braking_curves
      summary: Retrieve the etcs braking curves of an etcs train on etcs portions of the path
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: infra_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: electrical_profile_set_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: exception_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ETCS Braking Curves Output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/core.ETCSBrakingCurvesResponse'
  /train_schedules/{id}/path:
    get:
      tags:
      - train_schedule
      - pathfinding
      summary: Get a path from a paced train given an infrastructure id and a paced train id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: infra_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: exception_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathfindingResult'
        '404':
          description: Infrastructure or Train schedule not found
  /train_schedules/{id}/simulation:
    get:
      tags:
      - train_schedule
      summary: Retrieve the space, speed and time curve of a given train
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: infra_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: electrical_profile_set_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: exception_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Simulation Output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
  /version:
    get:
      responses:
        '200':
          description: Return the service version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /work_schedules:
    post:
      tags:
      - work_schedules
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: This structure is used by the post endpoint to create a work schedule
              required:
              - work_schedule_group_name
              - work_schedules
              properties:
                work_schedule_group_name:
                  type: string
                work_schedules:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkScheduleItemForm'
        required: true
      responses:
        '201':
          description: The id of the created work schedule group
          content:
            application/json:
              schema:
                type: object
                required:
                - work_schedule_group_id
                properties:
                  work_schedule_group_id:
                    type: integer
                    format: int64
  /work_schedules/group:
    get:
      tags:
      - work_schedules
      responses:
        '200':
          description: The existing work schedule group ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
    post:
      tags:
      - work_schedules
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                work_schedule_group_name:
                  type:
                  - string
                  - 'null'
        required: true
      responses:
        '200':
          description: The id of the created work schedule group
          content:
            application/json:
              schema:
                type: object
                required:
                - work_schedule_group_id
                properties:
                  work_schedule_group_id:
                    type: integer
                    format: int64
  /work_schedules/group/{id}:
    get:
      tags:
      - work_schedules
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 100
          maximum: 100
          minimum: 1
      - name: id
        in: path
        description: A work schedule group ID
        required: true
        schema:
          type: integer
          format: int64
      - name: ordering
        in: query
        required: false
        schema:
          type: string
          enum:
          - NameAsc
          - NameDesc
          - CreationDateAsc
          - CreationDateDesc
          - LastModifiedDesc
          - LastModifiedAsc
      responses:
        '200':
          description: The work schedules in the group
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationStats'
                - type: object
                  required:
                  - results
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/WorkSchedule'
        '404':
          description: Work schedule group not found
    put:
      tags:
      - work_schedules
      parameters:
      - name: id
        in: path
        description: A work schedule group ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/WorkScheduleItemForm'
        required: true
      responses:
        '200':
          description: The work schedules have been created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkSchedule'
        '404':
          description: Work schedule group not found
    delete:
      tags:
      - work_schedules
      parameters:
      - name: id
        in: path
        description: A work schedule group ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: The work schedule group has been deleted
        '404':
          description: The work schedule group does not exist
  /work_schedules/project_path:
    post:
      tags:
      - work_schedules
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - work_schedule_group_id
              - path_track_ranges
              properties:
                path_track_ranges:
                  type: array
                  items:
                    $ref: '#/components/schemas/core.TrackRange'
                work_schedule_group_id:
                  type: integer
                  format: int64
        required: true
      responses:
        '200':
          description: Returns a list of work schedules whose track ranges intersect the given path
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Represents the projection of a work schedule on a path.
                  required:
                  - type
                  - start_date_time
                  - end_date_time
                  - path_position_ranges
                  properties:
                    end_date_time:
                      type: string
                      format: date-time
                      description: The date and time when the work schedule ends.
                    path_position_ranges:
                      type: array
                      items:
                        $ref: '#/components/schemas/Intersection'
                      description: |-
                        a list of intervals `(a, b)` that represent the projections of the work schedule track ranges:
                        - `a` is the distance from the beginning of the path to the beginning of the track range
                        - `b` is the distance from the beginning of the path to the end of the track range
                    start_date_time:
                      type: string
                      format: date-time
                      description: The date and time when the work schedule takes effect.
                    type:
                      oneOf:
                      - type: string
                        enum:
                        - CATENARY
                        - TRACK
                      description: The type of the work schedule.
  /worker_load:
    post:
      tags:
      - worker
      summary: Ensure a worker for the given infra (and stdcm timetable) is ready
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - infra_id
              properties:
                infra_id:
                  type: integer
                  format: int64
                  description: The infra id of the worker to load
                timetable_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  description: The timetable id to load, if any
        required: true
      responses:
        '200':
          description: The worker status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStatus'
        '404':
          description: The timetable was not found
components:
  schemas:
    AddOperation:
      type: object
      description: JSON Patch 'add' operation representation
      required:
      - path
      - value
      properties:
        path:
          type: string
          description: |-
            JSON-Pointer value [RFC6901](https://tools.ietf.org/html/rfc6901) that references a location
            within the target document where the operation is performed.
        value:
          description: Value to add to the target location.
    ApplicableDirections:
      type: string
      enum:
      - START_TO_STOP
      - STOP_TO_START
      - BOTH
    ApplicableDirectionsTrackRange:
      type: object
      required:
      - track
      - begin
      - end
      - applicable_directions
      properties:
        applicable_directions:
          $ref: '#/components/schemas/ApplicableDirections'
        begin:
          type: number
          format: double
        end:
          type: number
          format: double
        track:
          type: string
          maxLength: 255
          minLength: 1
      additionalProperties: false
    BoundingBox:
      type: object
      description: A bounding box
      required:
      - min_lon
      - min_lat
      - max_lon
      - max_lat
      properties:
        max_lat:
          type: number
          format: double
        max_lon:
          type: number
          format: double
        min_lat:
          type: number
          format: double
        min_lon:
          type: number
          format: double
    BufferStop:
      type: object
      required:
      - id
      - track
      - position
      properties:
        extensions:
          type: object
          properties:
            sncf:
              oneOf:
              - type: 'null'
              - type: object
                required:
                - kp
                properties:
                  kp:
                    type: string
                additionalProperties: false
          additionalProperties: false
        id:
          type: string
          maxLength: 255
          minLength: 1
        position:
          type: number
          format: double
        track:
          type: string
          maxLength: 255
          minLength: 1
      additionalProperties: false
    CatalogEntry:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
        name:
          type:
          - string
          - 'null'
    CatalogEntryForm:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
    Comfort:
      type: string
      enum:
      - STANDARD
      - AIR_CONDITIONING
      - HEATING
    ConditionalEffortCurve:
      type: object
      required:
      - cond
      - curve
      properties:
        cond:
          $ref: '#/components/schemas/EffortCurveConditions'
        curve:
          $ref: '#/components/schemas/EffortCurve'
      additionalProperties: false
    Conflict:
      type: object
      required:
      - train_ids
      - work_schedule_ids
      - start_time
      - end_time
      - conflict_type
      - requirements
      properties:
        conflict_type:
          oneOf:
          - type: string
            enum:
            - Spacing
            - Routing
          description: Type of the conflict
        end_time:
          type: string
          format: date-time
          description: Datetime of the end of the conflict
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/core.ConflictRequirement'
          description: List of requirements causing the conflict
        start_time:
          type: string
          format: date-time
          description: Datetime of the start of the conflict
        train_ids:
          type: array
          items:
            oneOf:
            - type: object
              required:
              - train_schedule_id
              - index
              - type
              properties:
                index:
                  type: integer
                  minimum: 0
                train_schedule_id:
                  type: integer
                  format: int64
                type:
                  type: string
                  enum:
                  - base
            - type: object
              required:
              - train_schedule_id
              - index
              - exception_id
              - exception_key
              - type
              properties:
                exception_id:
                  type: integer
                  format: int64
                exception_key:
                  type: string
                index:
                  type: integer
                  minimum: 0
                train_schedule_id:
                  type: integer
                  format: int64
                type:
                  type: string
                  enum:
                  - modified
            - type: object
              required:
              - train_schedule_id
              - exception_id
              - exception_key
              - type
              properties:
                exception_id:
                  type: integer
                  format: int64
                exception_key:
                  type: string
                train_schedule_id:
                  type: integer
                  format: int64
                type:
                  type: string
                  enum:
                  - created
            description: This ID is used to identify paced train occurrences and exceptions when sending them to the core API for conflict detection.
          description: List of trains involved in the conflict.
        work_schedule_ids:
          type: array
          items:
            type: integer
            format: int64
          description: List of work schedule ids involved in the conflict
    ConsistConfiguration:
      type: object
      required:
      - rolling_stock_id
      properties:
        loading_gauge_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LoadingGaugeType'
        max_speed:
          type:
          - number
          - 'null'
          format: double
          description: Velocity in m·s⁻¹
        rolling_stock_id:
          type: integer
          format: int64
        speed_limit_tag:
          type:
          - string
          - 'null'
        total_length:
          type:
          - number
          - 'null'
          format: double
          description: Length in m
        total_mass:
          type:
          - number
          - 'null'
          format: double
          description: Mass in kg
        towed_rolling_stock_id:
          type:
          - integer
          - 'null'
          format: int64
    ConsistSchedule:
      type: object
      required:
      - boundaries
      - values
      properties:
        boundaries:
          type: array
          items:
            type: integer
            minimum: 0
          description: |-
            Indexes of steps where consist change occur
            It should not contain 0 and len(steps) and should be increasing
        values:
          type: array
          items:
            $ref: '#/components/schemas/ConsistConfiguration'
          description: |-
            Consist configuration for each segment
            It should contains one more element than boundaries
