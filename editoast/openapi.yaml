          format: int64
          description: If None the exception is created, otherwise it is a modified exception
        timetable_id:
          type: integer
          format: int64
        train_schedule_id:
          type: integer
          format: int64
    TrainScheduleExceptionChangeGroups:
      type: object
      properties:
