          type: boolean
    SimulationResponse:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/SimulationResponseSuccess'
        - type: object
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - success
      - type: object
        required:
        - pathfinding_failed
        - status
        properties:
          pathfinding_failed:
            $ref: '#/components/schemas/PathfindingFailure'
          status:
            type: string
            enum:
            - pathfinding_failed
      - type: object
        required:
        - core_error
        - status
        properties:
          core_error:
            $ref: '#/components/schemas/InternalError'
          status:
            type: string
            enum:
            - simulation_failed
    SimulationResponseSuccess:
      type: object
      required:
      - base
      - provisional
      - final_output
      - mrsp
      - electrical_profiles
      properties:
        base:
          $ref: '#/components/schemas/core.ReportTrain'
          description: Simulation without any regularity margins
        electrical_profiles:
          type: object
          required:
          - boundaries
          - values
          properties:
            boundaries:
              type: array
              items:
                type: integer
                format: int64
                minimum: 0
              description: |-
                List of `n` boundaries of the ranges (block path).
                A boundary is a distance from the beginning of the path in mm.
            values:
              type: array
              items:
                oneOf:
                - type: object
                  required:
                  - electrical_profile_type
                  properties:
                    electrical_profile_type:
                      type: string
                      enum:
                      - no_profile
                - type: object
                  required:
                  - handled
                  - electrical_profile_type
                  properties:
                    electrical_profile_type:
                      type: string
                      enum:
                      - profile
                    handled:
                      type: boolean
                    profile:
                      type:
                      - string
                      - 'null'
              description: List of `n+1` values associated to the ranges
        final_output:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/core.ReportTrain'
            - type: object
              required:
              - signal_critical_positions
              - zone_updates
              - spacing_requirements
              - routing_requirements
              properties:
                routing_requirements:
                  type: array
                  items:
                    $ref: '#/components/schemas/core.RoutingRequirement'
                signal_critical_positions:
                  type: array
                  items:
                    $ref: '#/components/schemas/core.SignalCriticalPosition'
                spacing_requirements:
                  type: array
                  items:
                    $ref: '#/components/schemas/core.SpacingRequirement'
                zone_updates:
                  type: array
                  items:
                    $ref: '#/components/schemas/core.ZoneUpdate'
          description: Simulation that takes into account the regularity margins and the schedule item times
        mrsp:
          type: object
          description: A MRSP computation result (Most Restrictive Speed Profile)
          required:
          - boundaries
          - values
          properties:
            boundaries:
              type: array
              items:
                type: integer
                format: int64
                minimum: 0
              description: |-
                List of `n` boundaries of the ranges (block path).
                A boundary is a distance from the beginning of the path in mm.
            values:
              type: array
              items:
                type: object
                required:
                - speed
                properties:
                  source:
                    oneOf:
                    - type: 'null'
                    - oneOf:
                      - type: object
                        required:
                        - tag
                        - speed_limit_source_type
                        properties:
                          speed_limit_source_type:
                            type: string
                            enum:
                            - given_train_tag
                          tag:
                            type: string
                      - type: object
                        required:
                        - tag
                        - speed_limit_source_type
                        properties:
                          speed_limit_source_type:
                            type: string
                            enum:
                            - fallback_tag
                          tag:
                            type: string
                      - type: object
                        required:
                        - speed_limit_source_type
                        properties:
                          speed_limit_source_type:
                            type: string
                            enum:
                            - unknown_tag
                    description: source of the speed-limit if relevant (tag used)
                  speed:
                    type: number
                    format: double
                    description: in meters per second
              description: List of `n+1` values associated to the ranges
        provisional:
          $ref: '#/components/schemas/core.ReportTrain'
          description: Simulation that takes into account the regularity margins
    SimulationSummaryResult:
      oneOf:
      - type: object
        description: Minimal information on a simulation's result
        required:
        - length
        - time
        - energy_consumption
        - path_item_times_final
        - path_item_times_provisional
        - path_item_times_base
        - path_item_respect_times
        - path_item_respect_margins
        - status
        properties:
          energy_consumption:
            type: number
            format: double
            description: Total energy consumption of a train in kWh
          length:
            type: integer
            format: int64
            description: Length of a path in mm
            minimum: 0
          path_item_respect_margins:
            type: array
            items:
              type: boolean
            description: |-
              Whether the final path times respect the input margins for each train schedule path item.
              The length of this array is the number of path items in the train schedule used as input for the simulation.
              Important: `true` means the provisional time is acceptable margin-wise, not *precisely* respecting the margin.
          path_item_respect_times:
            type: array
            items:
              type: boolean
            description: |-
              Whether each path item in the train schedule is reached on time.
              The length of this array is the number of path items in the train schedule used as input for the simulation.
              Important: `true` doesn't mean the path item has been reached *precisely* at the requested time. Instead, it means it reached the path item at an acceptable time.
          path_item_times_base:
            type: array
            items:
              type: integer
              format: int64
              minimum: 0
            description: |-
              Base simulation time for each train schedule path item.
              The length of this array is the number of path items in the train schedule used as input for the simulation.
              The first value is always `0` (beginning of the path) and the last one, the total time of the simulation (end of the path)
          path_item_times_final:
            type: array
            items:
              type: integer
              format: int64
              minimum: 0
            description: |-
              Final simulation time for each train schedule path item.
              The length of this array is the number of path items in the train schedule used as input for the simulation.
              The first value is always `0` (beginning of the path) and the last one, the total time of the simulation (end of the path)
          path_item_times_provisional:
            type: array
            items:
              type: integer
              format: int64
              minimum: 0
            description: |-
              Provisional simulation time for each train schedule path item.
              The length of this array is the number of path items in the train schedule used as input for the simulation.
              The first value is always `0` (beginning of the path) and the last one, the total time of the simulation (end of the path)
          status:
            type: string
            enum:
            - success
          time:
            type: integer
            format: int64
            description: Travel time in ms
            minimum: 0
      - allOf:
        - $ref: '#/components/schemas/core.PathfindingNotFound'
          description: Pathfinding not found
        - type: object
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - pathfinding_not_found
        description: Pathfinding not found
      - type: object
        description: An error has occurred during pathfinding
        required:
        - core_error
        - status
        properties:
          core_error:
            $ref: '#/components/schemas/InternalError'
          status:
            type: string
            enum:
            - pathfinding_failure
      - type: object
        description: An error has occurred during computing
        required:
        - error_type
        - status
        properties:
          error_type:
            type: string
          status:
            type: string
            enum:
            - simulation_failed
      - allOf:
        - $ref: '#/components/schemas/core.PathfindingInputError'
          description: InputError
        - type: object
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - pathfinding_input_error
        description: InputError
    Slope:
      type: object
      required:
