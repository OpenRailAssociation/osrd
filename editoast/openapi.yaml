  /level_crossing_occupancy:
    post:
      tags:
      - level_crossing
      summary: Get the occupancy of a set of level crossings for a set of trains
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - train_ids
              - level_crossing_ids
              - infra_id
              - timetable_id
              properties:
                electrical_profile_set_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                infra_id:
                  type: integer
                  format: int64
                level_crossing_ids:
                  type: array
                  items:
                    $ref: '#/components/schemas/Identifier'
                timetable_id:
                  type: integer
                  format: int64
                train_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
        required: true
      responses:
        '200':
          description: Occupancy periods of the given level crossings
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    allOf:
                    - oneOf:
                      - type: object
                        required:
                        - train_schedule_id
                        - index
                        - type
                        properties:
                          index:
                            type: integer
                            minimum: 0
                          train_schedule_id:
                            type: integer
                            format: int64
                          type:
                            type: string
                            enum:
                            - base
                      - type: object
                        required:
                        - train_schedule_id
                        - index
                        - exception_id
                        - exception_key
                        - type
                        properties:
                          exception_id:
                            type: integer
                            format: int64
                          exception_key:
                            type: string
                          index:
                            type: integer
                            minimum: 0
                          train_schedule_id:
                            type: integer
                            format: int64
                          type:
                            type: string
                            enum:
                            - modified
                      - type: object
                        required:
                        - train_schedule_id
                        - exception_id
                        - exception_key
                        - type
                        properties:
                          exception_id:
                            type: integer
                            format: int64
                          exception_key:
                            type: string
                          train_schedule_id:
                            type: integer
                            format: int64
                          type:
                            type: string
                            enum:
                            - created
                      description: This ID is used to identify paced train occurrences and exceptions when sending them to the core API for conflict detection.
                    - type: object
                      required:
                      - time_begin
                      - duration
                      properties:
                        duration:
                          type: string
                          example: PT5M
                        time_begin:
                          type: string
                          format: date-time
                    - type: object
                      required:
                      - direction
                      properties:
                        direction:
                          $ref: '#/components/schemas/Direction'
                propertyNames:
                  type: string
                  maxLength: 255
                  minLength: 1
