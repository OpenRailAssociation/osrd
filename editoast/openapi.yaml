            inertia_coefficient:
              type: number
              format: double
            length:
              type: integer
              format: int64
              minimum: 0
            mass:
              type: integer
              format: int64
              minimum: 0
            max_speed:
              type: number
              format: double
              description: Velocity in m·s⁻¹
            power_restrictions:
              type: object
              description: Mapping of power restriction code to power class
              additionalProperties:
                type: string
              propertyNames:
                type: string
            raise_pantograph_time:
              type:
              - integer
              - 'null'
              format: int64
              description: |-
                The time it takes to raise this train's pantograph.
                Is null if the train is not electric or the value not specified.
              minimum: 0
            rolling_resistance:
              $ref: '#/components/schemas/RollingResistance'
            startup_acceleration:
              type: number
              format: double
              description: Acceleration in m·s⁻²
