openapi: 3.1.0
info:
  title: OSRD Editoast
  description: All HTTP endpoints of Editoast
  license:
    name: LGPL
    url: https://www.gnu.org/licenses/lgpl-3.0.html
  version: 0.1.0
paths:
  /authz/grants:
    post:
      tags:
      - authz
      requestBody:
        description: List of new authorization to add or to remove (i.e. grants a resource to a person)
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - grant
                properties:
                  grant:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrantBody'
              - type: object
                required:
                - revoke
                properties:
                  revoke:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevokeBody'
              description: '`grant` XOR `revoke` is expected'
        required: true
      responses:
        '201':
          description: Successful granting
        '204':
          description: Successful revoking
  /authz/groups:
    get:
      tags:
      - authz
      responses:
        '200':
          description: List all the groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  properties:
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
  /authz/me:
    get:
      tags:
      - authz
      responses:
        '200':
          description: Get the info of the current user
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - roles
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
  /authz/me/grants:
    post:
      tags:
      - authz
      requestBody:
        description: HashMap of resource type with a list of resource id to get the grants for. If a resource doesn't exist, it will be omitted.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: array
                items:
                  type: integer
                  format: int64
              propertyNames:
                type: string
                enum:
                - infra
        required: true
      responses:
        '200':
          description: Get grants info of the current user for the given resources in body
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - grant
                    properties:
                      grant:
                        $ref: '#/components/schemas/InfraGrant'
                      id:
                        type: integer
                        format: int64
                propertyNames:
                  type: string
                  enum:
                  - infra
  /authz/me/groups:
    get:
      tags:
      - authz
      responses:
        '200':
          description: Get the groups of the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  properties:
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
  /authz/me/privileges:
    post:
      tags:
      - authz
      requestBody:
        description: The resources of which to get the request sender's privileges. If a resource doesn't exist, it will be omitted.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: array
                items:
                  type: integer
                  format: int64
              propertyNames:
                type: string
                enum:
                - infra
        required: true
      responses:
        '200':
          description: The privileges of the user sending the request over each requested resource.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    required:
                    - resource_id
                    - privileges
                    properties:
                      privileges:
                        type: array
                        items:
                          $ref: '#/components/schemas/InfraPrivilege'
                        uniqueItems: true
                      resource_id:
                        type: integer
                        format: int64
                propertyNames:
                  type: string
                  enum:
                  - infra
  /authz/user/info:
    post:
      tags:
      - authz
      requestBody:
        description: A list of user IDs and identities to get information on
        content:
          application/json:
            schema:
              type: object
              properties:
                identities:
                  type: array
                  items:
                    type: string
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
        required: true
      responses:
        '200':
          description: Get information on a list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  - identities
                  - roles
                  - groups
                  properties:
                    groups:
                      type: array
                      items:
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          id:
                            type: integer
                            format: int64
                          name:
                            type: string
                      uniqueItems: true
                    id:
                      type: integer
                      format: int64
                    identities:
                      type: array
                      items:
                        type: string
                    name:
                      type: string
                    roles:
                      type: array
                      items:
                        $ref: '#/components/schemas/Role'
                      uniqueItems: true
  /authz/{resource_type}/{resource_id}:
    get:
      tags:
      - authz
      parameters:
      - name: resource_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceType'
      - name: resource_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Get list of user that have a grant on the resource
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  - type
                  - grant
                  properties:
                    grant:
                      $ref: '#/components/schemas/InfraGrant'
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
                    type:
                      $ref: '#/components/schemas/SubjectType'
  /catalog_entries:
    get:
      tags:
      - catalog_entry
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 100
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: List of catalog entries
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationStats'
                - type: object
                  required:
                  - results
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/CatalogEntry'
    post:
      tags:
      - catalog_entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEntryForm'
        required: true
      responses:
        '201':
          description: Catalog entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntry'
  /catalog_entries/{id}:
    put:
      tags:
      - catalog_entry
      parameters:
      - name: id
        in: path
        description: A catalog entry ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEntryForm'
        required: true
      responses:
        '200':
          description: Catalog entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntry'
        '404':
          description: Catalog entry not found
    delete:
      tags:
      - catalog_entry
      parameters:
      - name: id
        in: path
        description: A catalog entry ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: The catalog entry was deleted
        '404':
          description: Catalog entry not found
  /documents:
    post:
      tags:
      - documents
      summary: Post a new document (content_type by header + binary data)
      parameters:
      - name: content_type
        in: header
        description: The document's content type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
        required: true
      responses:
        '201':
          description: The document was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewDocumentResponse'
  /documents/{document_key}:
    get:
      tags:
      - documents
      summary: Returns a document of any type
      parameters:
      - name: document_key
        in: path
        description: The document's key
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Document content
          content:
            application/octet-stream:
              schema:
                type: string
    delete:
      tags:
      - documents
      summary: Delete an existing document
      parameters:
      - name: document_key
        in: path
        description: The document's key
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: The document was deleted
  /electrical_profile_set:
    get:
      tags:
      - electrical_profiles
      summary: Retrieve the list of ids and names of electrical profile sets available
      responses:
        '200':
          description: The list of ids and names of electrical profile sets available
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LightElectricalProfileSet'
    post:
      tags:
      - electrical_profiles
      summary: import a new electrical profile set
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectricalProfileSetData'
        required: true
      responses:
        '200':
          description: The list of ids and names of electrical profile sets available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectricalProfileSet'
  /electrical_profile_set/{electrical_profile_set_id}:
    get:
      tags:
      - electrical_profiles
      summary: Return a specific set of electrical profiles
      parameters:
      - name: electrical_profile_set_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The list of electrical profiles in the set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectricalProfileSetData'
    delete:
      tags:
      - electrical_profiles
      summary: Delete an electrical profile set
      parameters:
      - name: electrical_profile_set_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: The electrical profile was deleted successfully
  /electrical_profile_set/{electrical_profile_set_id}/level_order:
    get:
      tags:
      - electrical_profiles
      summary: Return the electrical profile value order for this set
      parameters:
      - name: electrical_profile_set_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A dictionary mapping electrification modes to a list of electrical profiles ordered by decreasing strength
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/LevelValues'
                propertyNames:
                  type: string
              example:
                1500V:
                - A
                - B
                - C
                25000V:
                - 25000V
                - 22500V
                - 20000V
  /fonts/{font}/{glyph}:
    get:
      tags:
      - fonts
      summary: This endpoint is used by map libre to retrieve the fonts. They are separated by font and unicode block
      parameters:
      - name: font
        in: path
        description: Requested font
        required: true
        schema:
          type: string
      - name: glyph
        in: path
        description: Requested unicode block
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Glyphs in PBF format of the font at the requested unicode block
        '404':
          description: Font not found
  /health:
    get:
      responses:
        '200':
          description: Check if Editoast is running correctly
          content:
            text/plain:
              schema:
                type: string
  /infra:
    get:
      tags:
      - infra
      summary: Lists all infras along with their current loading state in Core
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1000
          maximum: 1000
          minimum: 1
      responses:
        '200':
          description: All infras, paginated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationStats'
                - type: object
                  required:
                  - results
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/Infra'
    post:
      tags:
      - infra
      summary: Creates an empty infra
      description: The infra may be edited by batch later via the `POST /infra/ID` or `POST /infra/ID/railjson` endpoints.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: The name to give to the new infra
              additionalProperties: false
        required: true
      responses:
        '201':
          description: The created infra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Infra'
  /infra/railjson:
    post:
      tags:
      - infra
      summary: Import an infra from railjson
      parameters:
      - name: name
        in: query
        description: The name of the infrastructure.
        required: true
        schema:
          type: string
      - name: generate_data
        in: query
        description: Flag indicating whether to generate data.
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RailJson'
        required: true
      responses:
        '201':
          description: The imported infra id
          content:
            application/json:
              schema:
                type: object
                required:
                - infra
                properties:
                  infra:
                    type: integer
                    format: int64
        '404':
          description: The infra was not found
  /infra/refresh:
    post:
      tags:
      - infra
      summary: Refresh infra generated geographic layers
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
      - name: infras
        in: query
        description: |-
          A comma-separated list of infra IDs to refresh

          If not provided, all available infras will be refreshed.
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - infra_refreshed
                properties:
                  infra_refreshed:
                    type: array
                    items:
                      type: integer
                      format: int64
                    description: The list of infras that were refreshed successfully
        '404':
          description: Invalid infra ID query parameters
  /infra/voltages:
    get:
      tags:
      - infra
      - rolling_stock
      summary: Returns the set of voltages for all infras and rolling_stocks modes.
      responses:
        '200':
          description: Voltages list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - 750V
              - 1500V
              - 2500.5V
        '404':
          description: The infra was not found
  /infra/{infra_id}:
    get:
      tags:
      - infra
      summary: Retrieve a specific infra
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The infra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Infra'
        '404':
          description: Infra ID not found
    put:
      tags:
      - infra
      summary: Rename an infra
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: The new name to give the infra
        required: true
      responses:
        '200':
          description: The infra has been renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Infra'
        '404':
          description: Infra ID not found
    post:
      tags:
      - infra
      summary: Edit the content of an infrastructure
      description: |-
        Takes a batch of operations. An operation is a JSON patch document that will
        be applied to the RailJSON description of the appropriate infra object.

        The consistency of the patch with the RailJSON schema is checked. If a patch
        is erroneous, the whole batch is rejected.

        After editing the object, the generated cartographic layers are invalidated and
        regenerated. The edition step fails if the regeneration fails.
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
        required: true
      responses:
        '200':
          description: The result of the operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InfraObject'
    delete:
      tags:
      - infra
      summary: Delete an infra and all entities linked to it.
      description: |-
        This operation cannot be undone.

        So beware.

        You've been warned.

        This operation may take a while to complete.
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: The infra has been deleted
        '404':
          description: Infra ID not found
  /infra/{infra_id}/attached/{track_id}:
    get:
      tags:
      - infra
      summary: Retrieve all objects attached to a given track
      parameters:
      - name: infra_id
        in: path
        description: An infra ID
        required: true
        schema:
          type: integer
          format: int64
      - name: track_id
        in: path
        description: A track section ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: All objects attached to the given track (arranged by types)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                propertyNames:
                  type: string
                  enum:
                  - TrackSection
                  - Signal
                  - SpeedSection
                  - Detector
                  - NeutralSection
                  - Switch
                  - SwitchType
                  - BufferStop
                  - Route
                  - OperationalPoint
                  - Electrification
                  - LevelCrossing
  /infra/{infra_id}/auto_fixes:
    get:
      tags:
      - infra
      summary: Retrieve a list of operations to fix infra issues
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The list of suggested operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operation'
  /infra/{infra_id}/clone:
    post:
      tags:
      - infra
      summary: Duplicate an infra
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      - name: name
        in: query
        description: The name of the new infra
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The new infra ID
          content:
            text/plain:
              schema:
                type: integer
                format: int64
                minimum: 0
        '404':
          description: Infra ID not found
  /infra/{infra_id}/delimited_area:
    get:
      tags:
      - delimited_area
      summary: Computes all tracks between a set of `entries` locations and a set of `exits` locations
      description: |-
        Returns any track between one of the `entries` and one of the `exits`, i.e. any track that can
        be reached from an entry before reaching an exit.
        To prevent a missing exit to cause the graph traversal to never stop exploring, the exploration
        stops when a maximum distance is reached and no exit has been found.
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - track_ranges
              properties:
                track_ranges:
                  type: array
                  items:
                    $ref: '#/components/schemas/DirectionalTrackRange'
        required: true
      responses:
        '200':
          description: The track ranges between a list entries and exits.
          content:
            application/json:
              schema:
                type: object
                required:
                - track_ranges
                properties:
                  track_ranges:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectionalTrackRange'
  /infra/{infra_id}/errors:
    get:
      tags:
      - infra
      summary: A paginated list of errors related to an infra
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 100
          maximum: 100
          minimum: 1
      - name: level
        in: query
        description: Whether the response should include errors or warnings
        required: false
        schema:
          type: string
          enum:
          - warnings
          - errors
          - all
      - name: error_type
        in: query
        description: The type of error to filter on
        required: false
        schema:
          type: string
          description: Auto-generated discriminant enum variants
          enum:
          - duplicated_group
          - empty_object
          - invalid_group
          - invalid_reference
          - invalid_route
          - invalid_switch_ports
          - missing_route
          - missing_buffer_stop
          - node_endpoints_not_unique
          - object_out_of_path
          - odd_buffer_stop_location
          - out_of_range
          - overlapping_electrifications
          - overlapping_speed_sections
          - overlapping_switches
          - unknown_port_name
          - unused_port
      - name: object_id
        in: query
        description: Filter errors and warnings related to a given object
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A paginated list of errors
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationStats'
                - type: object
                  required:
                  - results
                  properties:
                    results:
                      type: array
                      items:
                        type: object
                        required:
                        - information
                        properties:
                          information:
                            $ref: '#/components/schemas/InfraError'
  /infra/{infra_id}/lines/{line_code}/bbox:
    get:
      tags:
      - infra
      summary: Returns the BBoxes of a line
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
          type: integer
          format: int64
      - name: line_code
        in: path
        description: A line code
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The BBox of the line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoundingBox'
  /infra/{infra_id}/lock:
    post:
      tags:
      - infra
      summary: Lock an infra
      parameters:
      - name: infra_id
        in: path
        description: An existing infra ID
        required: true
        schema:
