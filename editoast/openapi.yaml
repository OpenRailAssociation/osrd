    CorePathfindingResultSuccess:
      type: object
      description: A successful pathfinding result. This is also used for STDCM response.
      required:
      - path
      - length
      - path_item_positions
      properties:
        backtrack_path_items:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
          description: The indexes of the path items where the train backtracks
        length:
          type: integer
          format: int64
          description: Length of the path in mm
          minimum: 0
        path:
          $ref: '#/components/schemas/CoreTrainPath'
          description: Full description of the path data
        path_item_positions:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: |-
            The path offset in mm of each path item given as input of the pathfinding
            The first value is always `0` (beginning of the path) and the last one is always equal to the `length` of the path in mm
    CoreReportTrain:
      type: object
      required:
      - positions
      - times
      - speeds
      - energy_consumption
      - path_item_times
      properties:
        energy_consumption:
          type: number
          format: double
          description: Total energy consumption
        path_item_times:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: |-
            Time in ms at which the train *arrives* at each path item given as input of the pathfinding
            The first value is always `0` (beginning of the path) and the last one, the total time of the simulation (end of the path)

            In case multiple path items are at the same position, the stop duration
            of the earlier ones are added to the path item time of the next. For
            example, if A and B are at the same position, and A has a stop duration
            of 2s, then the path item time of B will be equal to the path item time
            of A plus 2s.
        positions:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: |-
            List of positions of a train
            Both positions (in mm) and times (in ms) must have the same length
        speeds:
          type: array
          items:
            type: number
            format: double
          description: List of speeds associated to a position
        times:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
    CoreRoutingRequirement:
      type: object
      required:
      - route
      - begin_time
      - zones
      properties:
        begin_time:
          type: integer
          format: int64
          description: |-
            Time in ms since a reference point that depends on which struct embeds this one:
            - in `TrainRequirements` & `TrainRequirementsById` (conflict detection & timetable
              requirements): a request-wide origin shared by all trains, `work_schedules` and the
              response (`1970-01-01T00:00:00Z` for calendar timetables, the timetable start for
              hourly ones);
            - in `CompleteReportTrain` (simulation results): the train's own `start_time`.
          minimum: 0
        route:
          type: string
        zones:
          type: array
          items:
            $ref: '#/components/schemas/CoreRoutingZoneRequirement'
    CoreRoutingZoneRequirement:
      type: object
      required:
      - zone
      - entry_detector
      - exit_detector
      - switches
      - end_time
      properties:
        end_time:
          type: integer
          format: int64
          description: |-
            Time in ms since a reference point that depends on which struct embeds this one:
            - in `TrainRequirements` & `TrainRequirementsById` (conflict detection & timetable
              requirements): a request-wide origin shared by all trains, `work_schedules` and the
              response (`1970-01-01T00:00:00Z` for calendar timetables, the timetable start for
              hourly ones);
            - in `CompleteReportTrain` (simulation results): the train's own `start_time`.
          minimum: 0
        entry_detector:
          type: string
        exit_detector:
          type: string
        switches:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        zone:
          type: string
    CoreSignalCriticalPosition:
      type: object
      description: |-
        First position (space and time) along the path where given signal must
