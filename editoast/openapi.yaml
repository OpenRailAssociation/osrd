            required:
            - boundaries
            - values
            properties:
              boundaries:
                type: array
                items:
                  type: integer
                  format: int64
                  minimum: 0
                description: |-
                  List of `n` boundaries of the ranges.
                  A boundary is a distance from the beginning of the path in mm.
              values:
                type: array
                items:
                  oneOf:
                  - type: object
                    description: Electrified section with a given voltage
                    required:
                    - voltage
                    - type
                    properties:
                      type:
                        type: string
                        enum:
                        - electrification
                      voltage:
                        type: string
                  - type: object
                    description: Neutral section with a lower pantograph instruction or just a dead section
                    required:
                    - lower_pantograph
                    - type
                    properties:
                      lower_pantograph:
                        type: boolean
                      type:
                        type: string
                        enum:
                        - neutral_section
                  - type: object
                    description: Non electrified section
                    required:
                    - type
                    properties:
                      type:
                        type: string
                        enum:
                        - non_electrified
                description: List of `n+1` values associated to the ranges
