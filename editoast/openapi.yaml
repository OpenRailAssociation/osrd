                $ref: '#/components/schemas/WorkerStatus'
        '404':
          description: The timetable was not found
components:
  schemas:
    AddOperation:
      type: object
      description: JSON Patch 'add' operation representation
      required:
      - path
      - value
      properties:
        path:
          type: string
          description: |-
            JSON-Pointer value [RFC6901](https://tools.ietf.org/html/rfc6901) that references a location
            within the target document where the operation is performed.
        value:
          description: Value to add to the target location.
    ApplicableDirections:
      type: string
      enum:
      - START_TO_STOP
      - STOP_TO_START
      - BOTH
    ApplicableDirectionsTrackRange:
      type: object
      required:
      - track
      - begin
      - end
      - applicable_directions
      properties:
        applicable_directions:
          $ref: '#/components/schemas/ApplicableDirections'
        begin:
          type: number
          format: double
        end:
          type: number
          format: double
        track:
          type: string
          maxLength: 255
          minLength: 1
      additionalProperties: false
    BoundingBox:
      type: object
      description: A bounding box
      required:
      - min_lon
      - min_lat
      - max_lon
      - max_lat
      properties:
        max_lat:
          type: number
          format: double
        max_lon:
          type: number
          format: double
        min_lat:
          type: number
          format: double
        min_lon:
          type: number
          format: double
    BufferStop:
      type: object
      required:
      - id
      - track
      - position
      properties:
        extensions:
          $ref: '#/components/schemas/BufferStopExtension'
        id:
          type: string
          maxLength: 255
          minLength: 1
        position:
          type: number
          format: double
        track:
          type: string
          maxLength: 255
          minLength: 1
      additionalProperties: false
    BufferStopExtension:
      type: object
      properties:
        sncf:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BufferStopSncfExtension'
      additionalProperties: false
    BufferStopSncfExtension:
      type: object
      required:
      - kp
      properties:
        kp:
          type: string
      additionalProperties: false
    CatalogEntry:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
        name:
          type:
          - string
          - 'null'
    CatalogEntryForm:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
    Comfort:
      type: string
      enum:
      - STANDARD
      - AIR_CONDITIONING
      - HEATING
    ConditionalEffortCurve:
      type: object
      required:
      - cond
      - curve
      properties:
        cond:
          $ref: '#/components/schemas/EffortCurveConditions'
        curve:
          $ref: '#/components/schemas/EffortCurve'
      additionalProperties: false
    Conflict:
      type: object
      required:
      - train_ids
      - work_schedule_ids
      - start_time
      - duration
      - conflict_type
      - requirements
      properties:
        conflict_type:
          $ref: '#/components/schemas/CoreConflictType'
          description: Type of the conflict
        duration:
          type: integer
          format: int64
          description: Duration of the conflict in ms.
          minimum: 0
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/CoreConflictRequirement'
          description: List of requirements causing the conflict
        start_time:
          type: integer
          format: int64
          description: |-
            Start of the conflict time range: elapsed ms since an implicit 'request base time'.
            This is the *union* of all the conflicting time ranges.

            The implicit 'request base time' is the same as the train schedules' `start_time`
            frame in this timetable.
            Example: `1970-01-01T00:00:00Z` for calendar timetables; the timetable start for hourly
            timetables.
        train_ids:
          type: array
          items:
            oneOf:
            - type: object
              title: OccurrenceIdBase
              required:
              - train_schedule_id
              - index
              - type
              properties:
                index:
                  type: integer
                  minimum: 0
                train_schedule_id:
                  type: integer
                  format: int64
                type:
                  type: string
                  enum:
                  - base
            - type: object
              title: OccurrenceIdModified
              required:
              - train_schedule_id
              - index
              - exception_id
              - type
              properties:
                exception_id:
                  type: integer
                  format: int64
                index:
                  type: integer
                  minimum: 0
                train_schedule_id:
                  type: integer
                  format: int64
                type:
                  type: string
                  enum:
                  - modified
            - type: object
              title: OccurrenceIdCreated
              required:
              - train_schedule_id
              - exception_id
              - type
              properties:
                exception_id:
                  type: integer
                  format: int64
                train_schedule_id:
                  type: integer
                  format: int64
                type:
                  type: string
                  enum:
                  - created
            description: This ID is used to identify paced train occurrences and exceptions when sending them to the core API for conflict detection.
          description: List of trains involved in the conflict.
        work_schedule_ids:
          type: array
          items:
            type: integer
            format: int64
          description: List of work schedule ids involved in the conflict
    ConsistConfiguration:
      type: object
      required:
      - rolling_stock_id
      properties:
        loading_gauge_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LoadingGaugeType'
        max_speed:
          type:
          - number
          - 'null'
          format: double
          description: Velocity in m·s⁻¹
        rolling_stock_id:
          type: integer
          format: int64
        speed_limit_tag:
          type:
          - string
          - 'null'
          description: Train categories for speed limits
        total_length:
          type:
          - number
          - 'null'
          format: double
          description: Length in m
        total_mass:
          type:
          - number
          - 'null'
          format: double
          description: Mass in kg
        towed_rolling_stock_id:
          type:
          - integer
          - 'null'
          format: int64
    ConsistSchedule:
      type: object
      required:
      - boundaries
      - values
      properties:
        boundaries:
          type: array
          items:
            type: integer
            minimum: 0
          description: |-
            Indexes of steps where consist change occur
            It should not contain 0 and len(steps) and should be increasing
        values:
          type: array
          items:
            $ref: '#/components/schemas/ConsistConfiguration'
          description: |-
            Consist configuration for each segment
            It should contain one more element than boundaries
    ConstraintDistributionChangeGroup:
      type: object
      required:
      - value
      properties:
        value:
          $ref: '#/components/schemas/Distribution'
    CopyOperation:
      type: object
      description: JSON Patch 'copy' operation representation
      required:
      - from
      - path
      properties:
        from:
          type: string
          description: |-
            JSON-Pointer value [RFC6901](https://tools.ietf.org/html/rfc6901) that references a location
            to copy value from.
        path:
          type: string
          description: |-
            JSON-Pointer value [RFC6901](https://tools.ietf.org/html/rfc6901) that references a location
            within the target document where the operation is performed.
    CoreConflictRequirement:
      type: object
      description: |-
        Unmet requirement causing a conflict.

        The start time and duration describe the conflicting time span (not the full
        requirement's time span).
      required:
      - zone
      - start_time
      - duration
      properties:
        duration:
          type: integer
          format: int64
          description: Duration of the time range in ms (difference between the latest end time and the earliest start_time for any zone use in this conflict).
          minimum: 0
        start_time:
          type: integer
          format: int64
          description: |-
            Start of the time range during which the zone is contested: elapsed ms since the implicit
            'request base time'. Earliest start time for any zone use.

            The implicit 'request base time' is the same over the whole request
            (`trains_requirements` and `work_schedules`) and response.
            Example: `1970-01-01T00:00:00Z` for calendar timetables; the timetable start for hourly
            timetables.
        zone:
          type: string
    CoreConflictType:
      type: string
      enum:
      - Spacing
      - Routing
    CoreETCSBrakingCurvesResponse:
      type: object
      required:
      - slowdowns
      - stops
      - conflicts
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/CoreETCSConflictCurves'
          description: |-
            List of ETCS conflict braking curves associated to the train schedule's ETCS signals.
            For each non-route delimiter (F) signal, the associated spacing conflict curve is returned.
            For each route delimiter (Nf) signal, 2 sets of curves are returned, associated to the
            corresponding potential spacing or routing conflict.
        slowdowns:
          type: array
          items:
            $ref: '#/components/schemas/CoreETCSCurves'
          description: List of ETCS braking curves associated to the train schedule's ETCS slowdowns
        stops:
          type: array
          items:
            $ref: '#/components/schemas/CoreETCSCurves'
          description: List of ETCS braking curves associated to the train schedule's ETCS stops
    CoreETCSConflictCurves:
      type: object
      required:
      - indication
      - permitted_speed
      - guidance
      - conflict_type
      properties:
        conflict_type:
          $ref: '#/components/schemas/CoreConflictType'
        guidance:
          $ref: '#/components/schemas/CoreSimpleEnvelope'
        indication:
          $ref: '#/components/schemas/CoreSimpleEnvelope'
        permitted_speed:
          $ref: '#/components/schemas/CoreSimpleEnvelope'
    CoreETCSCurves:
      type: object
      required:
      - permitted_speed
      - guidance
      properties:
        guidance:
          $ref: '#/components/schemas/CoreSimpleEnvelope'
        indication:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CoreSimpleEnvelope'
        permitted_speed:
          $ref: '#/components/schemas/CoreSimpleEnvelope'
    CoreIncompatibleConstraints:
      type: object
      required:
      - incompatible_electrification_ranges
