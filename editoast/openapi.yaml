      required:
      - signal
      - time
      - position
      - state
      properties:
        position:
          type: integer
          format: int64
          description: Position in mm
          minimum: 0
        signal:
          type: string
        state:
          type: string
        time:
          type: integer
          format: int64
          description: Time in ms
          minimum: 0
    CoreSignalUpdate:
      type: object
      required:
      - signal_id
      - signaling_system
      - time_start
      - time_end
      - position_start
      - position_end
      - color
      - blinking
      - aspect_label
      properties:
        aspect_label:
          type: string
          description: The labels of the new aspect
        blinking:
          type: boolean
          description: Whether the signal is blinking
        color:
          type: integer
          format: int32
          description: |-
            The color of the aspect
            (Bits 24-31 are alpha, 16-23 are red, 8-15 are green, 0-7 are blue)
        position_end:
          type: integer
          format: int64
          description: The route ends at this position in mm on the train path
          minimum: 0
        position_start:
          type: integer
          format: int64
          description: The route starts at this position in mm on the train path
          minimum: 0
        signal_id:
          type: string
          description: The id of the updated signal
        signaling_system:
          type: string
          description: The name of the signaling system of the signal
        time_end:
          type: integer
          format: int64
          description: The aspects stop being displayed at this time (number of ms since `departure_time`)
          minimum: 0
        time_start:
          type: integer
          format: int64
          description: The aspects start being displayed at this time (number of ms since `departure_time`)
          minimum: 0
    CoreSimpleEnvelope:
      type: object
      required:
      - positions
      - times
      - speeds
      properties:
        positions:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: |-
            List of positions of a train
            Both positions (in mm) and times (in ms) must have the same length
        speeds:
          type: array
          items:
            type: number
            format: double
          description: List of speeds (in m/s) associated to a position
        times:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: List of times (in ms) associated to a position
    CoreSpacingRequirement:
      type: object
      required:
      - zone
      - begin_time
      - end_time
      properties:
        begin_time:
