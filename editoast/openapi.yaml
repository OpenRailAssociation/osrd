                - exe
                - end
                - rev
                properties:
                  announcement:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sign'
                  end:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sign'
                  exe:
                    $ref: '#/components/schemas/Sign'
                  rev:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sign'
                additionalProperties: false
          additionalProperties: false
        id:
          type: string
          maxLength: 255
          minLength: 1
        lower_pantograph:
          type: boolean
        track_ranges:
          type: array
          items:
            $ref: '#/components/schemas/DirectionalTrackRange'
      additionalProperties: false
