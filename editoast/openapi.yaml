        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 100
          maximum: 100
          minimum: 1
      - name: level
        in: query
        description: Whether the response should include errors or warnings
        required: false
        schema:
          type: string
          enum:
          - warnings
          - errors
          - all
      - name: error_type
        in: query
        description: The type of error to filter on
        required: false
        schema:
          type: string
          description: Auto-generated discriminant enum variants
          enum:
          - duplicated_group
          - empty_object
          - invalid_group
          - invalid_reference
          - invalid_route
          - invalid_switch_ports
          - missing_route
          - missing_buffer_stop
          - node_endpoints_not_unique
          - object_out_of_path
          - odd_buffer_stop_location
          - out_of_range
          - overlapping_electrifications
          - overlapping_speed_sections
          - overlapping_switches
          - unknown_port_name
          - unused_port
      - name: object_id
        in: query
        description: Filter errors and warnings related to a given object
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A paginated list of errors
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationStats'
                - type: object
                  required:
                  - results
                  properties:
                    results:
                      type: array
                      items:
                        type: object
                        required:
                        - information
