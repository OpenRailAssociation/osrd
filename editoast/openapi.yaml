  /similar_trains:
    post:
      tags:
      - similar_trains
      - stdcm
      - sncf
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - rolling_stock
              - waypoints
              properties:
                rolling_stock:
                  type: object
                  properties:
                    name:
                      type:
                      - string
                      - 'null'
                    speed_limit_tag:
                      type:
                      - string
                      - 'null'
                waypoints:
                  type: array
                  items:
                    $ref: '#/components/schemas/SimilarTrainWaypoint'
        required: true
      responses:
        '200':
          description: A combination of reference train identifiers similar to the provided train
          content:
            application/json:
              schema:
                type: object
                required:
                - similar_trains
                properties:
                  similar_trains:
                    type: array
                    items:
                      type: object
                      required:
                      - begin
                      - end
                      properties:
                        begin:
                          type: string
                        end:
                          type: string
                        train:
                          oneOf:
                          - type: 'null'
                          - type: object
                            required:
                            - train_name
                            - start_time
                            properties:
                              start_time:
                                type: string
                                format: date-time
                              train_name:
                                type: string
                          description: |-
                            `train` is `None` if no similar train
                            was found for the segment; otherwise, it is `Some`.
