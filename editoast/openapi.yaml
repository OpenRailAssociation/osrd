      - id
      - announcement_track_ranges
      - track_ranges
      - lower_pantograph
      properties:
        announcement_track_ranges:
          type: array
          items:
            $ref: '#/components/schemas/DirectionalTrackRange'
        extensions:
          type: object
          properties:
            neutral_sncf:
              oneOf:
              - type: 'null'
              - type: object
                required:
