    core.ConsistConfiguration:
      type: object
      description: Represents a physics consist.
      required:
      - supported_signaling_systems
      - loading_gauge_type
      - physics_consist
      properties:
        loading_gauge_type:
          $ref: '#/components/schemas/LoadingGaugeType'
          description: The loading gauge of the rolling stock
        physics_consist:
          type: object
          required:
