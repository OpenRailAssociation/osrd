      type: object
      required:
      - value
      properties:
        value:
          type: string
    TrainSchedule:
      allOf:
      - type: object
        required:
        - train_name
        - rolling_stock_name
        - start_time
        - path
        - constraint_distribution
        properties:
          category:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TrainCategory'
          comfort:
            $ref: '#/components/schemas/Comfort'
          constraint_distribution:
            $ref: '#/components/schemas/Distribution'
          initial_speed:
            type: number
            format: double
          labels:
            type: array
            items:
              type: string
          margins:
            $ref: '#/components/schemas/Margins'
          options:
            $ref: '#/components/schemas/TrainScheduleOptions'
          path:
            type: array
            items:
              $ref: '#/components/schemas/PathItem'
          power_restrictions:
            type: array
            items:
              type: object
              required:
              - from
              - to
              - value
              properties:
                from:
                  type: string
                  minLength: 1
                to:
                  type: string
                  minLength: 1
                value:
                  type: string
              additionalProperties: false
          rolling_stock_name:
            type: string
          schedule:
            type: array
            items:
              $ref: '#/components/schemas/ScheduleItem'
          speed_limit_tag:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NonBlankString'
          start_time:
            type: integer
            format: int64
            description: |-
              For calendar timetables: elapsed ms since 1970-01-01T00:00:00Z.
              For hourly timetables: elapsed ms since the timetable start.
          train_name:
            type: string
      - type: object
        properties:
          paced:
            oneOf:
            - type: 'null'
            - type: object
              required:
              - time_window
              - interval
              - exceptions
              properties:
                exceptions:
                  type: array
                  items:
                    $ref: '#/components/schemas/PacedTrainException'
                interval:
                  $ref: '#/components/schemas/StrictlyPositiveDuration'
                  description: Time between two occurrences, an ISO 8601 format is expected
                time_window:
                  $ref: '#/components/schemas/StrictlyPositiveDuration'
                  description: Duration of the paced train, an ISO 8601 format is expected
    TrainScheduleException:
