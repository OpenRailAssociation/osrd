          type: boolean
        use_speed_limits_for_simulation:
          type: boolean
      additionalProperties: false
    TrainSchedulePart:
      type: object
      description: A part of a train schedule, from one step of its path to another.
      required:
      - train_schedule_id
      - from
      - to
      properties:
        from:
          $ref: '#/components/schemas/TrainSchedulePartBound'
          description: Path step of the train_schedule where the part begins
        to:
          $ref: '#/components/schemas/TrainSchedulePartBound'
          description: Path step of the train_schedule where the part ends
