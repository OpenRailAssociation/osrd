          rolling_stock_name:
            type: string
      - type: object
        title: PathfindingInputErrorZeroLengthPath
        required:
        - error_type
        properties:
          error_type:
            type: string
            enum:
            - zero_length_path
    CorePathfindingNotFound:
      oneOf:
      - type: object
        title: PathfindingNotFoundNotFoundInBlocks
        required:
        - track_section_ranges
        - length
        - error_type
        properties:
          error_type:
            type: string
