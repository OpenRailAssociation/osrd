[project]
name = "tests"
version = "0.1.1"
description = "Integration tests"
authors = [{ name = "OSRD Contributors", email = "<contact@osrd.fr>" }]
requires-python = ">=3.11"

dependencies = [
  "osrd-schemas",
  "pytest-cov~=7.1.0",
  "pytest~=9.1.1",
  "railjson-generator",
  "requests~=2.34.2",
]

[project.optional-dependencies]
check = ["pyright~=1.1.410", "ruff~=0.16.0"]

[tool.pyright]
include = ["conftest.py", "fuzzer", "infra-scripts", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["../osrd_schemas", "../python/railjson_generator"]

[tool.uv.sources]
osrd-schemas = { path = "../osrd_schemas/", editable = true }
railjson_generator = { path = "../python/railjson_generator/", editable = true }

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[build-system]
requires = ["poetry-core>=2.4.1"]
build-backend = "poetry.core.masonry.api"
