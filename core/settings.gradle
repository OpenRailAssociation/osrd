pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
}


rootProject.name = 'osrd'
include 'kt-fast-collections-annotations'
include 'kt-fast-collections-generator'
include 'kt-fast-collections'
include 'kt-osrd-utils'
include 'kt-osrd-sncf-signaling'
include 'kt-osrd-signaling'
include 'kt-osrd-sim-infra'
include 'kt-osrd-rjs-parser'
include 'kt-osrd-sim-interlocking'
include 'kt-osrd-path'
include 'kt-railjson-builder'
include 'osrd-geom'
include 'osrd-railjson'
include 'envelope-sim'
include 'osrd-reporting'
include 'osrd-mp'


dependencyResolutionManagement {
    versionCatalogs
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = "https://maven-central-eu.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
}
