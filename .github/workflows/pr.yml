name: pr
on:
  - pull_request_target
jobs:
  label_pr:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: "Label PR"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Label PR
        uses: actions/labeler@v7.0.0
        with:
          sync-labels: true
