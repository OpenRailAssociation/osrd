name: Chart build and push

on:
  pull_request:
    paths:
      - 'chart/**'
  push:
    branches:
      - dev
      - staging
    paths:
      - 'chart/**'

jobs:
  check_lint_and_build:
    name: Lint and build the chart
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Check that the documentation is up to date
        run: |
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@latest
          .github/scripts/check-chart-diff.sh

      - name: Generate values schema json
        run: |
          curl -sSL https://raw.githubusercontent.com/dadav/helm-schema/refs/heads/main/signing-key.asc | gpg --import
          gpg --export F58707969D0FBFA5 > ~/.gnupg/pubring.gpg
          helm plugin install https://github.com/dadav/helm-schema/releases/download/0.23.3/helm-schema_0.23.3_Linux_x86_64.tar.gz --verify
          cd chart
          helm schema -a -p --dry-run | diff values.schema.json - || (echo "Schema must be re-generated! Run 'helm schema -a -p' in the chart directory" && exit 1)
          echo "Schema validation successful"

      - name: Set Name and Version
        run: |
          CHART_NAME="osrd-dev"
          CHART_IMAGES_REPOSITORY="edge"
          CHART_IMAGES_VERSION="dev"
          TIMESTAMP=$(date +%s)
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHART_VERSION="0.0.${TIMESTAMP}-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            CHART_VERSION="0.0.${TIMESTAMP}-dev-${SHORT_SHA}"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            CHART_VERSION="0.0.${TIMESTAMP}-staging-${SHORT_SHA}"
          fi

          echo "CHART_NAME=$CHART_NAME" >> $GITHUB_ENV
          echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_ENV

          sed -i "s/NAME_REPLACE_ME/$CHART_NAME/" ./chart/Chart.yaml
          sed -i "s/VERSION_REPLACE_ME/$CHART_VERSION/" ./chart/Chart.yaml
          sed -i "s/APP_VERSION_REPLACE_ME/$CHART_IMAGES_VERSION/" ./chart/Chart.yaml
          sed -i "s/REPOSITORY_VERSION_REPLACE_ME/$CHART_IMAGES_REPOSITORY/" ./chart/values.yaml
          sed -i "s/IMAGES_VERSION_REPLACE_ME/$CHART_IMAGES_VERSION/" ./chart/values.yaml

      - name: Lint Helm Chart
        run: |
          helm lint ./chart
          helm lint -f chart/test-values/values-demo.yaml chart
          helm lint -f chart/test-values/values-refs.yaml chart

      - name: Save and Push Helm Chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package ./chart
          echo "Pushing to oci://ghcr.io/openrailassociation/${CHART_NAME}:${CHART_VERSION}"
          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://ghcr.io/openrailassociation/osrd-charts
