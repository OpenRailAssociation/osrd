name: Publish Helm Chart to GHCR

on:
  # called by the release workflow once the service images are pushed
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write # required to push the chart to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set Name and Version
        env:
          CHART_VERSION: ${{ inputs.tag_name }}
        run: |
          CHART_NAME="osrd"
          CHART_IMAGES_REPOSITORY="stable"
          CHART_IMAGES_VERSION="${CHART_VERSION}"
          echo "CHART_NAME=$CHART_NAME" >> $GITHUB_ENV
          echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_ENV
          sed -i "s/NAME_REPLACE_ME/$CHART_NAME/" ./chart/Chart.yaml
          sed -i "s/VERSION_REPLACE_ME/$CHART_VERSION/" ./chart/Chart.yaml
          sed -i "s/APP_VERSION_REPLACE_ME/$CHART_IMAGES_VERSION/" ./chart/Chart.yaml
          sed -i "s/REPOSITORY_VERSION_REPLACE_ME/$CHART_IMAGES_REPOSITORY/" ./chart/values.yaml
          sed -i "s/IMAGES_VERSION_REPLACE_ME/$CHART_IMAGES_VERSION/" ./chart/values.yaml

      - name: Lint Helm Chart
        run: helm lint ./chart

      - name: Save and Push Helm Chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package ./chart
          echo "Pushing to oci://ghcr.io/openrailassociation/osrd-charts/${CHART_NAME}:${CHART_VERSION}"
          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://ghcr.io/openrailassociation/osrd-charts
